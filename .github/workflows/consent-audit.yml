name: Consent audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  consent:
    name: No tracker before Accept
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit third-party scripts
        run: node scripts/consent-audit.mjs
